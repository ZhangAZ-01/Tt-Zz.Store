<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff5e8">
    <meta name="robots" content="noindex, nofollow">
    <title>情话和刮刮乐</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <a class="back-button" href="index.html" aria-label="返回首页">‹</a>
        <div>
          <p class="page-kicker">SWEET TIME</p>
          <h1 class="page-title">情话和刮刮乐</h1>
        </div>
      </header>

      <section class="section love-card">
        <h2 class="section-title">随机情话</h2>
        <p class="love-note" id="love-note" aria-live="polite"></p>
        <button class="primary-button" id="change-note" type="button">换一条</button>
      </section>

      <section class="section">
        <h2 class="section-title">刮刮乐</h2>
        <p class="muted">用手指把涂层擦开，看看今天的小奖励。</p>
        <div class="scratch-stage">
          <div class="scratch-prize" id="scratch-prize"></div>
          <canvas class="scratch-canvas" id="scratch-canvas" aria-label="刮开查看奖励"></canvas>
        </div>
        <div class="action-row" style="margin-top: 14px;">
          <button class="secondary-button" id="new-prize" type="button">再抽一张</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html"><span>🏠</span><span>首页</span></a>
      <a href="things.html"><span>🧸</span><span>小事</span></a>
      <a class="active" href="interactive.html" aria-current="page"><span>💌</span><span>互动</span></a>
      <a href="message.html"><span>📮</span><span>留言</span></a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/interactive.js"></script>
  </body>
</html>
