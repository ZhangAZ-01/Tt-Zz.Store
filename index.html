<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f8f8">
    <meta name="robots" content="noindex, nofollow">
    <title>桐桐的专属小站</title>
    <link rel="icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SolidZORO/zpix-pixel-font@latest/dist/zpix.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="hero-kicker">PLAYER 1 · 桐桐</p>
        <h1 class="hero-title">欢迎回来，桐桐！<span class="blink">▌</span></h1>
        <div class="hp-bar" aria-hidden="true">
          <span>HP</span>
          <div class="hp-track"><div class="hp-fill"></div></div>
          <span>MAX</span>
        </div>
      </section>

      <section class="section" aria-label="桐桐的相册">
        <h2 class="section-title">★ 相册 · 可爱的你</h2>
        <div class="photo-gallery">
          <figure class="photo-frame" data-caption="lv.1 咖啡因补给中">
            <img src="images/tt_1.jpg" alt="桐桐拿着奶茶">
          </figure>
          <figure class="photo-frame" data-caption="lv.2 睡觉回血中">
            <img src="images/tt_2.jpg" alt="桐桐在被窝里睡觉">
          </figure>
          <figure class="photo-frame" data-caption="lv.3 打工中的勇者">
            <img src="images/tt_3.jpg" alt="桐桐认真工作">
          </figure>
          <figure class="photo-frame" data-caption="lv.4 隐藏剧情">
            <img src="images/tt_4.jpg" alt="桐桐的可爱瞬间">
          </figure>
        </div>
      </section>

      <section class="home-grid" aria-label="网站入口">
        <a class="tile" href="things.html">
          <span class="tile-icon">🧸</span>
          <span class="tile-title">100件小事</span>
          <span class="tile-subtitle">关于你的专属清单</span>
        </a>
        <a class="tile" href="interactive.html">
          <span class="tile-icon">💌</span>
          <span class="tile-title">情话刮刮乐</span>
          <span class="tile-subtitle">一句话 + 一个小奖励</span>
        </a>
        <a class="tile" href="quiz.html">
          <span class="tile-icon">🎮</span>
          <span class="tile-title">问答游戏</span>
          <span class="tile-subtitle">看看你有多了解我</span>
        </a>
        <a class="tile" href="message.html">
          <span class="tile-icon">📮</span>
          <span class="tile-title">留言板</span>
          <span class="tile-subtitle">想说什么都可以</span>
        </a>
        <a class="tile" href="wheel.html">
          <span class="tile-icon">🍜</span>
          <span class="tile-title">吃什么转盘</span>
          <span class="tile-subtitle">选择困难就交给它</span>
        </a>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="主导航">
      <a class="active" href="index.html" aria-current="page"><span>🏠</span><span>首页</span></a>
      <a href="things.html"><span>🧸</span><span>小事</span></a>
      <a href="interactive.html"><span>💌</span><span>互动</span></a>
      <a href="message.html"><span>📮</span><span>留言</span></a>
    </nav>
  </body>
</html>
