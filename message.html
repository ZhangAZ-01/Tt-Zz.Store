<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff5e8">
    <meta name="robots" content="noindex, nofollow">
    <title>留言板</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <a class="back-button" href="index.html" aria-label="返回首页">‹</a>
        <div>
          <p class="page-kicker">MESSAGE</p>
          <h1 class="page-title">留言板</h1>
        </div>
      </header>

      <section class="section">
        <h2 class="section-title">写给我</h2>
        <form class="message-form" id="message-form">
          <label class="muted" for="message-text">今天想说什么都可以，我会认真看。</label>
          <textarea id="message-text" required placeholder="写下今天的心情、愿望，或者一句想对我说的话"></textarea>
          <button class="primary-button" type="submit">提交留言</button>
        </form>
      </section>

      <section class="section">
        <h2 class="section-title">小纸条</h2>
        <div class="message-list" id="message-list" aria-live="polite"></div>
      </section>
    </main>

    <div class="toast" id="toast" hidden></div>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html"><span>🏠</span><span>首页</span></a>
      <a href="things.html"><span>🧸</span><span>小事</span></a>
      <a href="interactive.html"><span>💌</span><span>互动</span></a>
      <a class="active" href="message.html" aria-current="page"><span>📮</span><span>留言</span></a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/message.js"></script>
  </body>
</html>
