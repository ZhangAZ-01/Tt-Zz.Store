<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff5e8">
    <meta name="robots" content="noindex, nofollow">
    <title>关于你的100件小事</title>
    <link rel="icon" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <a class="back-button" href="index.html" aria-label="返回首页">‹</a>
        <div>
          <p class="page-kicker">100 THINGS</p>
          <h1 class="page-title">关于你的100件小事</h1>
        </div>
      </header>

      <section class="section">
        <div class="things-summary">
          <div>
            <h2 class="section-title">抽一张</h2>
            <p class="muted">今天先看哪一件，交给运气。</p>
          </div>
          <span class="things-count" id="thing-count">100条</span>
        </div>
        <button class="primary-button" id="draw-thing" type="button">抽一张</button>
      </section>

      <section class="section">
        <h2 class="section-title">完整清单</h2>
        <ol class="thing-list" id="thing-list"></ol>
      </section>
    </main>

    <div class="overlay" id="thing-overlay" hidden>
      <article class="random-card" aria-live="polite">
        <p class="random-number" id="random-number">001</p>
        <p class="random-text" id="random-text"></p>
        <div class="action-row">
          <button class="primary-button" id="draw-again" type="button">换一张</button>
          <button id="close-overlay" type="button">关闭</button>
        </div>
      </article>
    </div>

    <nav class="bottom-nav" aria-label="主导航">
      <a href="index.html"><span>🏠</span><span>首页</span></a>
      <a href="photos.html"><span>📷</span><span>相册</span></a>
      <a class="active" href="things.html" aria-current="page"><span>🧸</span><span>小事</span></a>
      <a href="interactive.html"><span>💌</span><span>互动</span></a>
      <a href="message.html"><span>📮</span><span>留言</span></a>
    </nav>

    <script src="js/data.js"></script>
    <script src="js/things.js"></script>
  </body>
</html>
